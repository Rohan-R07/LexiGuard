services:
  # Backend FastAPI Web Service
  - type: web
    name: lexiguard-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: API_ENV
        value: production
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct
      - key: CORS_ORIGINS
        value: https://lexiguard-frontend.onrender.com,http://localhost:5173
      - key: FRONTEND_URL
        value: https://lexiguard-frontend.onrender.com

  # Frontend React/Vite Static Site
  - type: web
    name: lexiguard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://lexiguard-backend-msvt.onrender.com/api
